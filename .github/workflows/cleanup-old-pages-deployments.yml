name: Remove three legacy Pages deployments

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the three failed legacy deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=(
            8c07ff54410dc667911432d69de2ccc4f60b2657
            494d8a3cc6b5f749f13c2a9572ee94cad806ce5f
            e944a49af113cde88eb899b22a1446062a4c888f
          )
          response="$(gh api -X GET "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100")"
          ids=()
          for sha in "${expected[@]}"; do
            id="$(jq -r --arg sha "$sha" '[.[] | select(.sha == $sha)] | if length == 1 then .[0].id else empty end' <<< "$response")"
            if [[ -z "$id" ]]; then
              echo "Expected exactly one github-pages deployment for $sha" >&2
              exit 1
            fi
            ids+=("$id")
          done
          for id in "${ids[@]}"; do
            if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id"; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id"
            fi
            echo "Removed legacy github-pages deployment $id"
          done

